name: Deploy Traefik

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: LETSENCRYPT_EMAIL,TRAEFIK_DASHBOARD_HOST,TRAEFIK_DASHBOARD_AUTH
          script: |
            cd ~/traefik
            git pull origin main
            printf "LETSENCRYPT_EMAIL=%s\nTRAEFIK_DASHBOARD_HOST=%s\nTRAEFIK_DASHBOARD_AUTH=%s\n" \
              "$LETSENCRYPT_EMAIL" "$TRAEFIK_DASHBOARD_HOST" "$TRAEFIK_DASHBOARD_AUTH" > .env
            sed "s|HASH_ICI|${TRAEFIK_DASHBOARD_AUTH}|g" traefik/dynamic.yml > traefik/dynamic.yml.tmp \
              && mv traefik/dynamic.yml.tmp traefik/dynamic.yml
            ./install.sh
            docker compose up -d
        env:
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          TRAEFIK_DASHBOARD_HOST: ${{ secrets.TRAEFIK_DASHBOARD_HOST }}
          TRAEFIK_DASHBOARD_AUTH: ${{ secrets.TRAEFIK_DASHBOARD_AUTH }}
